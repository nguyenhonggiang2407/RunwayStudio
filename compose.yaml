services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: runway_store
      MYSQL_USER: runway
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql,prod}
      DB_URL: jdbc:mysql://db:3306/runway_store?serverTimezone=UTC
      DB_USERNAME: runway
      DB_PASSWORD: ${DB_PASSWORD}
      RUNWAY_BOOTSTRAP_ENABLED: ${RUNWAY_BOOTSTRAP_ENABLED:-false}
      RUNWAY_BOOTSTRAP_EMAIL: ${RUNWAY_BOOTSTRAP_EMAIL:-}
      RUNWAY_BOOTSTRAP_PASSWORD: ${RUNWAY_BOOTSTRAP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
