name: Java, MySQL, browser and security checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  java-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run check
      - run: ./mvnw -B clean verify dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
      - run: python3 tools/dependency_audit.py --fail-on-high
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-browser-evidence
          path: |
            target/surefire-reports
            docs/evidence/dependency-audit.json
            docs/evidence/playwright-results.json
            docs/screenshots
            playwright-report
  mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-root-password
          MYSQL_DATABASE: runway_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/runway_acceptance?serverTimezone=UTC
      LEGACY_DB_URL: jdbc:mysql://127.0.0.1:3306/runway_legacy?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ci-disposable-root-password
      MYSQL_PWD: ci-disposable-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mysql -h127.0.0.1 -uroot -e 'CREATE DATABASE runway_legacy CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;'
      - run: ./mvnw -B -Pmysql-verify verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-evidence
          path: target/failsafe-reports
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
